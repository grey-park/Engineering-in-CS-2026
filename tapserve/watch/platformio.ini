
[platformio]
; hors OneDrive
workspace_dir = ~/.pio-work/tapserve-watch

[env:twatch]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.before_reset = usb_reset
upload_speed = 115200
; --no-stub sinon l'envoi bloque
upload_command = $PYTHONEXE $UPLOADER --chip esp32s3 --port $UPLOAD_PORT --baud $UPLOAD_SPEED --before usb_reset --after hard_reset --no-stub write_flash -z --flash_mode dio --flash_freq 80m --flash_size 16MB 0x0 $BUILD_DIR/bootloader.bin 0x8000 $BUILD_DIR/partitions.bin 0xe000 ${platformio.packages_dir}/framework-arduinoespressif32/tools/partitions/boot_app0.bin 0x10000 $SOURCE
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  lewisxhe/XPowersLib@^0.2.6
  adafruit/Adafruit DRV2605 Library@^1.2.4
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7
build_flags =
  -I../common
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Écran
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  -DTFT_MISO=-1
  -DTFT_MOSI=13
  -DTFT_SCLK=18
  -DTFT_CS=12
  -DTFT_DC=38
  -DTFT_RST=-1
  -DTFT_BL=45
  -DTFT_BACKLIGHT_ON=1
  -DUSE_FSPI_PORT=1
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT7=1
  -DLOAD_GFXFF=1
  -DSPI_FREQUENCY=40000000
