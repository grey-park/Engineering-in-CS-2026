
[platformio]
; hors OneDrive
workspace_dir = ~/.pio-work/tapserve-box
default_envs = table1

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7
build_flags = -I../common

[c3]
build_flags =
  -I../common
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:table1]
board = seeed_xiao_esp32c3
build_flags = ${c3.build_flags} -DBOARD_XIAO -DTABLE_ID=1

[env:table2]
board = seeed_xiao_esp32c3
build_flags = ${c3.build_flags} -DBOARD_XIAO -DTABLE_ID=2

[env:table1-supermini]
board = esp32-c3-devkitm-1
build_flags = ${c3.build_flags} -DTABLE_ID=1

[env:table1-devkit]
board = esp32dev
build_flags = -I../common -DTABLE_ID=1
